# Add to ApexVoid Enterprise docker compose configuration, not its Go/React code.
# Example from Enterprise directory:
# docker compose -f docker-compose.yml -f /absolute/path/to/enterprise-network.override.yml up -d
services:
  postgres:
    networks:
      - default
      - apexvoid-data
  backend:
    environment:
      INTEGRATIONS_ASSERTION_SECRET: ${INTEGRATIONS_ASSERTION_SECRET:?Set a unique 32+ character assertion secret}
      DATABASE_PROVISIONING_URL: ${DATABASE_PROVISIONING_URL:?Set the trusted PostgreSQL provisioning URL}
      DATABASE_PROVISIONING_KEY: ${DATABASE_PROVISIONING_KEY:?Set a stable 32+ character provisioning key}
    networks:
      - default
      - apexvoid-apps
      - apexvoid-data
networks:
  default: {}
  apexvoid-apps:
    external: true
    name: apexvoid-apps
  apexvoid-data:
    external: true
    name: apexvoid-data
