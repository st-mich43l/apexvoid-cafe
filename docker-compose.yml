services:
  cafe:
    build: .
    restart: unless-stopped
    environment:
      APEXVOID_URL: http://backend:6868
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      BOOTSTRAP_STATE_DIR: /var/lib/apexvoid/bootstrap
      SERVICE_URL: ${SERVICE_URL:-http://cafe:8090}
    volumes:
      - cafe-bootstrap-state:/var/lib/apexvoid/bootstrap
    networks:
      apexvoid-apps:
        aliases: [cafe]
      apexvoid-data: {}
    # Intentionally NO host ports: all user access is through Enterprise.

volumes:
  cafe-bootstrap-state:

networks:
  apexvoid-apps:
    external: true
    name: apexvoid-apps
  apexvoid-data:
    external: true
    name: apexvoid-data
