name: Format Phase 2 Go changes
on:
  push:
    branches:
      - feat/phase2-advanced-booking
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Go formatting
        run: |
          gofmt -w internal/storage/store.go internal/service/server.go internal/bootstrap/manager.go internal/bootstrap/manager_test.go tests/integration/booking_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/storage/store.go internal/service/server.go internal/bootstrap/manager.go internal/bootstrap/manager_test.go tests/integration/booking_test.go
            git commit -m "style(booking): gofmt phase 2 corrections"
            git push origin HEAD:feat/phase2-advanced-booking
          fi
